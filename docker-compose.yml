version: "3.9"

services:


  db:
    image: mysql:8.0
    container_name: horarios_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"          
    volumes:
      - db_data:/var/lib/mysql                    # datos persistentes
      - ./init:/docker-entrypoint-initdb.d:ro     # scripts SQL que se ejecutan al crear la BD
    networks:
      - horarios_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER}", "--password=${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Adminer: cliente web para MySQL ──────────────────────
  adminer:
    image: adminer:4
    container_name: horarios_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"          # abre http://localhost:8080 en tu navegador
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa  # tema visual opcional
    depends_on:
      db:
        condition: service_healthy
    networks:
      - horarios_net

volumes:
  db_data:
    name: horarios_db_data

networks:
  horarios_net:
    name: horarios_network
